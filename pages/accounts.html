<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>NIVRA | الحسابات والرواجع</title>

    <link rel="stylesheet" href="../css/accounts.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <!-- رأس الصفحة -->
    <header class="topbar">
        <div class="topbar-brand">
            <h1>NIVRA</h1>
            <span>الحسابات والرواجع</span>
        </div>

        <a class="back-btn" href="../dashboard.html" title="العودة للرئيسية">
            <i class="fa-solid fa-arrow-right"></i>
        </a>
    </header>

    <main>

        <!-- ================= حالات الطلبات ================= -->
        <section class="cards-group">

            <h2 class="section-title">
                <i class="fa-solid fa-box-open"></i>
                حالات الطلبات
            </h2>

            <div class="order-status-cards">

                <button class="status-card done" data-status="completed">
                    <i class="fa-solid fa-circle-check"></i>
                    <h3>مكتمل</h3>
                    <span id="completedCount">0</span>
                </button>

                <button class="status-card rejected" data-status="cancelled">
                    <i class="fa-solid fa-circle-xmark"></i>
                    <h3>مرفوض</h3>
                    <span id="cancelledCount">0</span>
                </button>

                <button class="status-card delayed" data-status="returns">
                    <i class="fa-solid fa-rotate-left"></i>
                    <h3>راجع جزئي</h3>
                    <span id="pendingReturns">0</span>
                </button>

            </div>

        </section>


        <!-- ================= الحسابات المالية ================= -->
        <section class="cards-group finance-section">

            <h2 class="section-title">
                <i class="fa-solid fa-wallet"></i>
                الحسابات المالية
            </h2>

            <div class="finance-cards">

                <button class="status-card ready">
                    <i class="fa-solid fa-money-bill-wave"></i>
                    <h3>المبلغ الكلي</h3>
                    <span id="totalFinance">0</span>
                </button>

                <button class="status-card net">
                    <i class="fa-solid fa-coins"></i>
                    <h3>المبلغ الصافي</h3>
                    <span id="netFinance">0</span>
                </button>

            </div>

        </section>


        <!-- ================= قائمة الحسابات ================= -->
        <section class="card accounts-section">

            <div class="orders-search-card">

                <!-- شريط التحكم -->
                <div class="control-bar">

                    <h2>
                        <i class="fa-solid fa-file-invoice-dollar"></i>
                        سجل الحسابات
                    </h2>

                    <!-- البحث -->
                    <div class="search-mini">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input
                            type="search"
                            id="search"
                            placeholder="بحث باسم الزبون أو رقم الطلب..."
                            autocomplete="off">
                    </div>

                    <!-- تحديد الكل -->
                    <label class="select-all">
                        <input type="checkbox" id="selectAllAccounts">
                        <span>تحديد الكل</span>
                    </label>

                    <!-- الأزرار -->
                    <div class="control-icons">

                        <button
                            type="button"
                            id="receiveMoney"
                            title="استلام الأموال">
                            <i class="fa-solid fa-money-bill-transfer"></i>
                        </button>

                        <button
                            type="button"
                            id="receiveReturns"
                            title="استلام الرواجع">
                            <i class="fa-solid fa-arrow-rotate-left"></i>
                        </button>

                        <button
                            type="button"
                            id="openReturnsScanner"
                            title="مسح باركود الرواجع والمرفوضات">
                            <i class="fa-solid fa-camera"></i>
                        </button>

                    </div>

                </div>


                <!-- الجدول -->
                <div class="table-box">

                    <table>

                        <thead>
                            <tr>
                                <th>رقم الطلب</th>
                                <th>الزبون</th>
                                <th>الهاتف</th>
                                <th>المحافظة</th>
                                <th>المبلغ</th>
                                <th>الرواجع</th>
                                <th>الحالة</th>
                                <th>المالية</th>
                                <th>إجراء</th>
                            </tr>
                        </thead>

                        <tbody id="accountsTable"></tbody>

                    </table>

                </div>

            </div>

        </section>


        <!-- ================= نافذة تفاصيل الحساب ================= -->
        <div id="modal">

            <div class="card modal-box">

                <button type="button" id="close" title="إغلاق">
                    <i class="fa-solid fa-xmark"></i>
                </button>

                <div id="details"></div>

            </div>

        </div>


        <!-- ================= ماسح الكاميرا ================= -->
        <div id="returnsScannerModal" class="scanner-modal">

            <div class="scanner-box">

                <div class="scanner-header">
                    <div>
                        <h2>
                            <i class="fa-solid fa-camera"></i>
                            ماسح الطلبات
                        </h2>
                        <p>امسح باركود الطلب لعرض بياناته</p>
                    </div>

                    <button
                        type="button"
                        id="closeReturnsScanner"
                        class="scanner-close"
                        title="إغلاق الماسح">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <!-- اختيار نوع البحث -->
                <div class="scanner-types">

                    <button
                        type="button"
                        class="scanner-type active"
                        data-scan-type="cancelled">
                        <i class="fa-solid fa-circle-xmark"></i>
                        المرفوضات
                    </button>

                    <button
                        type="button"
                        class="scanner-type"
                        data-scan-type="returns">
                        <i class="fa-solid fa-rotate-left"></i>
                        الرواجع الجزئية
                    </button>

                </div>

                <!-- عرض الكاميرا -->
                <div class="scanner-camera">

                    <video
                        id="returnsScannerVideo"
                        autoplay
                        muted
                        playsinline>
                    </video>

                    <div class="scanner-frame">
                        <span></span>
                    </div>

                    <div class="scanner-camera-message" id="scannerMessage">
                        اضغط بدء المسح لتشغيل الكاميرا
                    </div>

                </div>

                <!-- نتيجة المسح -->
                <div class="scanner-result" id="scannerResult">
                    <i class="fa-solid fa-barcode"></i>
                    <span>بانتظار قراءة الباركود...</span>
                </div>

                <div class="scanner-actions">

                    <button
                        type="button"
                        id="startReturnsScan"
                        class="scanner-start-btn">
                        <i class="fa-solid fa-camera"></i>
                        بدء المسح
                    </button>

                    <button
                        type="button"
                        id="stopReturnsScan"
                        class="scanner-stop-btn">
                        <i class="fa-solid fa-stop"></i>
                        إيقاف
                    </button>

                </div>

            </div>

        </div>

    </main>

    <script type="module" src="../js/accounts.js"></script>

</body>
</html>
